name: Bug Report
description: Report a bug in Persnicket
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Package.swift target configuration
        2. Command or build action that triggered the issue
        3. Error output or unexpected behavior
    validations:
      required: true

  - type: input
    id: persnicket-version
    attributes:
      label: Persnicket version
      description: The release tag or commit your package depends on (see `Package.resolved`).
      placeholder: "e.g., 2.2.0, or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Persnoop (build tool)
        - Persnipe (command)
        - Both / Not sure
    validations:
      required: true

  - type: dropdown
    id: invocation
    attributes:
      label: How was the plugin run?
      options:
        - Xcode build or xcodebuild
        - swift build
        - swift package plugin / format-source-code
        - Xcode command plugin menu
    validations:
      required: true

  - type: dropdown
    id: strict-mode
    attributes:
      label: Was Persnoop strict mode on?
      description: Turned on by `PERSNICKET_STRICT` (1, true, or yes) or a `.persnicket-strict` file in the project root.
      options:
        - "No"
        - "Yes, via PERSNICKET_STRICT"
        - "Yes, via .persnicket-strict"
        - Not sure / not applicable
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: swift-version
    attributes:
      label: Swift version
      placeholder: "e.g., 6.0.3"
    validations:
      required: true

  - type: input
    id: xcode-version
    attributes:
      label: Xcode version (macOS only)
      placeholder: "e.g., 16.2"
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: ".swift-format configuration"
      description: Paste your `.swift-format` file contents, if relevant.
      render: json
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that might help.
    validations:
      required: false
