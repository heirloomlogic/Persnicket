name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Unconditional because this workflow now only runs on `pull_request`. If a
  # `push` or deploy trigger is ever added back, gate this on `github.event_name`
  # again so a merge-time or deploy run is not cancelled by the next one.
  cancel-in-progress: true

# No dependency cache anywhere below, deliberately: every manifest in this repo
# uses local path dependencies (Examples/CompileCheck -> path: "../.."), there is
# no Package.resolved, and no step fetches anything over the network. There is
# nothing to cache, so a cache step here would only add a key that never varies.

jobs:
  swift-format-lint:
    name: swift-format (strict)
    # The only job that needs macOS: it typechecks the Xcode plugin variants
    # against Xcode's own PluginAPI, which ships inside Xcode.app and nowhere
    # else. Everything else in this file runs on Linux.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes. This job runs the Persnoop build-tool plugin and
          # the Persnipe command plugin, both of which exec an externally
          # discovered swift-format, so the token has no business surviving into
          # .git/config where they could read it.
          persist-credentials: false

      - name: Log toolchain versions
        run: |
          xcode-select -p
          xcrun swift --version
          xcrun swift-format --version || true

      - name: Verify embedded fallback is in sync with .swift-format
        run: |
          ./bin/regenerate-embedded-fallback
          git diff --exit-code -- Plugins/Persnoop/plugin.swift Plugins/Persnipe/plugin.swift

      - name: Verify shared plugin infrastructure is identical
        run: ./bin/check-shared-plugin-code

      # `swift build` never compiles the `#if canImport(XcodeProjectPlugin)` code —
      # the CLI toolchain's PluginAPI doesn't ship that module — so the Xcode plugin
      # variants would otherwise be verified by nothing.
      - name: Typecheck Xcode plugin variants
        run: |
          API="$(xcode-select -p)/../SharedFrameworks/SwiftPM.framework/Versions/A/SharedSupport/PluginAPI"
          xcrun swiftc -typecheck -parse-as-library -I "$API" -package-description-version 6.0 \
              Plugins/Persnoop/plugin.swift Plugins/Persnoop/XcodePlugin.swift
          xcrun swiftc -typecheck -parse-as-library -I "$API" -package-description-version 6.0 \
              Plugins/Persnipe/plugin.swift Plugins/Persnipe/XcodePlugin.swift

      - name: Setup swift-format lint
        run: ./bin/ci-lint-setup

      - name: Lint (strict)
        run: xcrun swift-format lint --strict --parallel --recursive --configuration .swift-format Plugins/ Examples/ Package.swift

      - name: Compile-check plugins via consumer fixture
        working-directory: Examples/CompileCheck
        run: |
          swift build
          swift package plugin --allow-writing-to-package-directory format-source-code

      - name: Verify plugins chunk large source sets
        working-directory: Examples/CompileCheck
        run: ./verify-large-target.sh

      - name: Verify Persnipe reformats and --target scoping works
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          printf 'print( "hello, world" )\n' > Sources/CompileCheck/main.swift
          swift package plugin --allow-writing-to-package-directory format-source-code --target CompileCheck
          if grep -q 'print( "hello, world" )' Sources/CompileCheck/main.swift; then
            echo "::error::Persnipe did not reformat a deliberately misformatted file"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          if ! grep -q 'print("hello, world")' Sources/CompileCheck/main.swift; then
            cat Sources/CompileCheck/main.swift
            echo "::error::Persnipe changed the file, but not to the expected formatting"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          git checkout -- Sources/CompileCheck/main.swift
          echo "ok: Persnipe reformatted the file via --target"

      # Without --follow-symlinks, swift-format skips a symlinked source file even when
      # it is named on the command line. swift-format 600 and 601 accept the flag but
      # still skip such a file (fixed in 602), so the 6.0 floor job omits this step.
      - name: Verify Persnipe formats a symlinked source file
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -rf Shared Sources/CompileCheck/Linked.swift' EXIT
          mkdir -p Shared
          printf 'func  linked( ) -> Int { 1 }\n' > Shared/Linked.swift
          ln -s ../../Shared/Linked.swift Sources/CompileCheck/Linked.swift
          swift package plugin --allow-writing-to-package-directory format-source-code --target CompileCheck
          if ! grep -q '^func linked() -> Int { 1 }$' Shared/Linked.swift || [ ! -L Sources/CompileCheck/Linked.swift ]; then
            cat Shared/Linked.swift
            echo "::error::Persnipe did not format a symlinked source file through the link"
            exit 1
          fi
          echo "ok: Persnipe formatted a symlinked source file through the link"

      # A config that parses but that swift-format refuses (a schema version from the
      # future) must fail the command, not report success having formatted nothing.
      # This and the negative steps below print their log only when the check fails:
      # the problem matcher would turn the expected errors into annotations on a pass.
      - name: Verify Persnipe fails on a configuration swift-format rejects
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format persnipe.log' EXIT
          printf '{"version": 99}\n' > .swift-format
          if swift package plugin --allow-writing-to-package-directory format-source-code > persnipe.log 2>&1; then
            cat persnipe.log
            echo "::error::Persnipe exited 0 on a configuration swift-format rejects"
            exit 1
          fi
          if ! grep -q 'cannot use the configuration' persnipe.log; then
            cat persnipe.log
            echo "::error::Persnipe failed for a reason other than the rejected configuration"
            exit 1
          fi
          echo "ok: Persnipe failed on the rejected configuration"

      - name: Verify Persnoop strict mode fails on violations
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          printf 'print("hello, world")\nlet value = Int("1")!\nprint(value)\n' > Sources/CompileCheck/main.swift
          rm -rf .build
          if PERSNICKET_STRICT=1 swift build > build.log 2>&1; then
            cat build.log
            echo "::error::strict mode did not fail the build on a lint violation"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          cat build.log
          if ! grep -q 'NeverForceUnwrap' build.log; then
            echo "::error::build failed for a reason other than the expected NeverForceUnwrap violation"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          rm -f build.log
          git checkout -- Sources/CompileCheck/main.swift
          echo "ok: strict mode failed the build as expected"

      # A .swift-format that isn't a JSON object configures nothing; the build must
      # fail naming the file rather than lint under some other configuration.
      - name: Verify an unusable .swift-format fails the build
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format config.log' EXIT
          printf '{ invalid\n' > .swift-format
          if swift build > config.log 2>&1; then
            cat config.log
            echo "::error::an unparsable .swift-format did not fail the build"
            exit 1
          fi
          if ! grep -q 'is unusable' config.log; then
            cat config.log
            echo "::error::build failed for a reason other than the unusable configuration"
            exit 1
          fi
          echo "ok: the unusable configuration failed the build"

      # swift-format reads .swift-format as JSON5 from 602 (Swift 6.2) on, so the plugin
      # must too. Strict, because otherwise a rejected config only warns and skips the
      # lint, and the build passes either way. Not on the 6.0 floor: swift-format 600
      # rejects JSON5, and warning and skipping is the right response there.
      - name: Verify a commented (JSON5) .swift-format builds
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format json5.log' EXIT
          printf '// A comment.\n{\n  "version": 1,\n  "lineLength": 120, // and a trailing comma\n}\n' > .swift-format
          if ! PERSNICKET_STRICT=1 swift build > json5.log 2>&1; then
            cat json5.log
            echo "::error::a commented (JSON5) .swift-format failed the build"
            exit 1
          fi
          echo "ok: the commented configuration was accepted"

  swift-format-lint-linux:
    name: swift-format (Linux, downstream-style)
    runs-on: ubuntu-latest
    # The toolchain arrives as an image rather than via swift-actions/setup-swift:
    # that action's latest stable (v2.4.0) still declares `using: node20`, which
    # reached end of life on 2026-04-30, and its only newer tag (v3.0.0-beta.1) is
    # a prerelease on the same runtime. It also removes this repo's last
    # third-party action and pins the compiler's major.minor: `swift:6.2` follows
    # 6.2 patch releases and image rebuilds. Dependabot can't bump `container:`
    # images (dependabot-core#5819), so these tags are maintained by hand.
    #
    # This is NOT a speed change: measured on run 32320949022, `Initialize
    # containers` costs 39s against the 37s the setup-swift step used to cost,
    # so the job stays at about 60s. Do not re-swap it chasing wall-clock.
    #
    # swift-format ships in the Swift Linux toolchain from 6.0 onward, so the
    # image needs no separate install. Use the full image, not -slim: the slim
    # variants omit the compiler.
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; see the macOS job above for why the plugins make
          # a persisted token a live exposure rather than a theoretical one.
          persist-credentials: false

      # The container runs as root over a checkout git considers foreign. Without
      # this, the `git checkout --` restores in the steps below fail on "dubious
      # ownership".
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup swift-format lint
        run: ./bin/ci-lint-setup

      - name: Lint (strict)
        run: swift-format lint --strict --parallel --recursive --configuration .swift-format Plugins/ Examples/ Package.swift

      - name: Compile-check plugins via consumer fixture
        working-directory: Examples/CompileCheck
        run: |
          swift build
          swift package plugin --allow-writing-to-package-directory format-source-code

      - name: Verify plugins chunk large source sets
        working-directory: Examples/CompileCheck
        run: ./verify-large-target.sh

      - name: Verify Persnipe reformats and --target scoping works
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          printf 'print( "hello, world" )\n' > Sources/CompileCheck/main.swift
          swift package plugin --allow-writing-to-package-directory format-source-code --target CompileCheck
          if grep -q 'print( "hello, world" )' Sources/CompileCheck/main.swift; then
            echo "::error::Persnipe did not reformat a deliberately misformatted file"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          if ! grep -q 'print("hello, world")' Sources/CompileCheck/main.swift; then
            cat Sources/CompileCheck/main.swift
            echo "::error::Persnipe changed the file, but not to the expected formatting"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          git checkout -- Sources/CompileCheck/main.swift
          echo "ok: Persnipe reformatted the file via --target"

      # See the matching step in the macOS job.
      - name: Verify Persnipe formats a symlinked source file
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -rf Shared Sources/CompileCheck/Linked.swift' EXIT
          mkdir -p Shared
          printf 'func  linked( ) -> Int { 1 }\n' > Shared/Linked.swift
          ln -s ../../Shared/Linked.swift Sources/CompileCheck/Linked.swift
          swift package plugin --allow-writing-to-package-directory format-source-code --target CompileCheck
          if ! grep -q '^func linked() -> Int { 1 }$' Shared/Linked.swift || [ ! -L Sources/CompileCheck/Linked.swift ]; then
            cat Shared/Linked.swift
            echo "::error::Persnipe did not format a symlinked source file through the link"
            exit 1
          fi
          echo "ok: Persnipe formatted a symlinked source file through the link"

      # See the matching step in the macOS job.
      - name: Verify Persnipe fails on a configuration swift-format rejects
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format persnipe.log' EXIT
          printf '{"version": 99}\n' > .swift-format
          if swift package plugin --allow-writing-to-package-directory format-source-code > persnipe.log 2>&1; then
            cat persnipe.log
            echo "::error::Persnipe exited 0 on a configuration swift-format rejects"
            exit 1
          fi
          if ! grep -q 'cannot use the configuration' persnipe.log; then
            cat persnipe.log
            echo "::error::Persnipe failed for a reason other than the rejected configuration"
            exit 1
          fi
          echo "ok: Persnipe failed on the rejected configuration"

      - name: Verify $SWIFT_FORMAT override handling
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          rm -rf .build
          SWIFT_FORMAT=/nonexistent/swift-format swift build > override.log 2>&1 || { cat override.log; exit 1; }
          grep -q 'not an executable file' override.log
          rm -rf .build
          SWIFT_FORMAT=relative/swift-format swift build > override2.log 2>&1 || { cat override2.log; exit 1; }
          grep -q 'not an absolute path' override2.log
          rm -f override.log override2.log
          echo "ok: misconfigured overrides warned and discovery fell back"

      - name: Verify Persnoop strict mode fails on violations
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          printf 'print("hello, world")\nlet value = Int("1")!\nprint(value)\n' > Sources/CompileCheck/main.swift
          rm -rf .build
          if PERSNICKET_STRICT=1 swift build > build.log 2>&1; then
            cat build.log
            echo "::error::strict mode did not fail the build on a lint violation"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          cat build.log
          if ! grep -q 'NeverForceUnwrap' build.log; then
            echo "::error::build failed for a reason other than the expected NeverForceUnwrap violation"
            git checkout -- Sources/CompileCheck/main.swift
            exit 1
          fi
          rm -f build.log
          git checkout -- Sources/CompileCheck/main.swift
          echo "ok: strict mode failed the build as expected"

      # See the matching step in the macOS job.
      - name: Verify an unusable .swift-format fails the build
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format config.log' EXIT
          printf '{ invalid\n' > .swift-format
          if swift build > config.log 2>&1; then
            cat config.log
            echo "::error::an unparsable .swift-format did not fail the build"
            exit 1
          fi
          if ! grep -q 'is unusable' config.log; then
            cat config.log
            echo "::error::build failed for a reason other than the unusable configuration"
            exit 1
          fi
          echo "ok: the unusable configuration failed the build"

      # See the matching step in the macOS job.
      - name: Verify a commented (JSON5) .swift-format builds
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format json5.log' EXIT
          printf '// A comment.\n{\n  "version": 1,\n  "lineLength": 120, // and a trailing comma\n}\n' > .swift-format
          if ! PERSNICKET_STRICT=1 swift build > json5.log 2>&1; then
            cat json5.log
            echo "::error::a commented (JSON5) .swift-format failed the build"
            exit 1
          fi
          echo "ok: the commented configuration was accepted"

  # The advertised minimum. Newer-toolchain jobs above would not catch uses of
  # stdlib/Foundation API added after Swift 6.0.
  swift-6-0-floor:
    name: Swift 6.0 floor (Linux container)
    runs-on: ubuntu-latest
    # The exact release, not `swift:6.0`, which floats to the latest 6.0.x patch and
    # would test that instead of the floor.
    container: swift:6.0.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; see the macOS job above.
          persist-credentials: false

      # See the Linux job above: `git checkout --` needs this in the container.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile-check plugins via consumer fixture
        working-directory: Examples/CompileCheck
        run: |
          swift build
          swift package plugin --allow-writing-to-package-directory format-source-code

      # See the matching step in the macOS job. swift-format's wording for a rejected
      # config has changed across versions, and Persnipe classifies by that wording.
      - name: Verify Persnipe fails on a configuration swift-format rejects
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format persnipe.log' EXIT
          printf '{"version": 99}\n' > .swift-format
          if swift package plugin --allow-writing-to-package-directory format-source-code > persnipe.log 2>&1; then
            cat persnipe.log
            echo "::error::Persnipe exited 0 on a configuration swift-format rejects"
            exit 1
          fi
          if ! grep -q 'cannot use the configuration' persnipe.log; then
            cat persnipe.log
            echo "::error::Persnipe failed for a reason other than the rejected configuration"
            exit 1
          fi
          echo "ok: Persnipe failed on the rejected configuration"

      # The bundled fallback config enables rules swift-format 600 predates, which
      # `--strict` turns into a failure before any file is linted. The strict-mode probe
      # must report that as a config/toolchain mismatch naming the rule, not let the
      # prebuild step fail with SwiftPM's raw command dump.
      - name: Verify strict mode names rules the floor's swift-format lacks
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f build.log' EXIT
          rm -rf .build
          if PERSNICKET_STRICT=1 swift build > build.log 2>&1; then
            cat build.log
            echo "::error::strict mode passed with rules swift-format 600 does not know"
            exit 1
          fi
          if ! grep -q 'cannot use the configuration' build.log || ! grep -q 'unrecognized rule' build.log; then
            cat build.log
            echo "::error::strict mode failed without naming the unrecognized rule"
            exit 1
          fi
          echo "ok: strict mode reported the unrecognized rules"

      # Proves the lint really runs on the floor toolchain, with a config swift-format
      # 600 fully understands. Every swift-format call, the preflight probe included,
      # passes --follow-symlinks; were 600 to reject it, the probe would fail and strict
      # mode would fail the build on that instead, with no NeverForceUnwrap finding in
      # the log, so the second check tells them apart.
      - name: Verify Persnoop strict mode fails on violations
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format build.log; git checkout -- Sources/CompileCheck/main.swift' EXIT
          printf '{"version": 1, "rules": {"NeverForceUnwrap": true}}\n' > .swift-format
          printf 'print("hello, world")\nlet value = Int("1")!\nprint(value)\n' > Sources/CompileCheck/main.swift
          rm -rf .build
          if PERSNICKET_STRICT=1 swift build > build.log 2>&1; then
            cat build.log
            echo "::error::strict mode did not fail the build on a lint violation"
            exit 1
          fi
          cat build.log
          if ! grep -q 'NeverForceUnwrap' build.log; then
            echo "::error::build failed for a reason other than the expected NeverForceUnwrap violation"
            exit 1
          fi
          echo "ok: strict mode failed the build as expected"

      # See the matching step in the macOS job. The plugin parses the config with the
      # toolchain's Foundation, which is the floor's here.
      - name: Verify an unusable .swift-format fails the build
        working-directory: Examples/CompileCheck
        run: |
          set -eu
          trap 'rm -f .swift-format config.log' EXIT
          printf '{ invalid\n' > .swift-format
          if swift build > config.log 2>&1; then
            cat config.log
            echo "::error::an unparsable .swift-format did not fail the build"
            exit 1
          fi
          if ! grep -q 'is unusable' config.log; then
            cat config.log
            echo "::error::build failed for a reason other than the unusable configuration"
            exit 1
          fi
          echo "ok: the unusable configuration failed the build"
